<div id="requestsPage" class="requestsPage padded-left padded-right padded-bottom-page">
    <div class="requestsPage-content">
        <div class="verticalSection">
            <div class="sectionTitleContainer flex align-items-center">
                <h2 class="sectionTitle">Requests</h2>
            </div>

            <form id="requestsSearchForm" class="requestsSearch" autocomplete="off" role="search">
                <div class="inputContainer requestsSearch-query">
                    <label class="inputLabel inputLabelUnfocused" for="requestsSearchInput">Search movies and TV shows</label>
                    <input id="requestsSearchInput" class="emby-input" type="search" enterkeyhint="search" maxlength="200" required>
                </div>
                <div class="selectContainer requestsSearch-type">
                    <label class="selectLabel" for="requestsMediaType">Type</label>
                    <select id="requestsMediaType" class="emby-select-withcolor emby-select">
                        <option value="All">All</option>
                        <option value="Movies">Movies</option>
                        <option value="TV Shows">TV Shows</option>
                    </select>
                    <div class="selectArrowContainer"><span class="selectArrow material-icons keyboard_arrow_down" aria-hidden="true"></span></div>
                </div>
                <button id="requestsSearchButton" type="submit" class="raised button-submit emby-button requestsSearch-button">
                    <span>Search</span>
                </button>
            </form>

            <div id="requestsStatus" class="fieldDescription requestsMessage" role="status" aria-live="polite"></div>
            <div id="requestsResults" class="itemsContainer vertical-wrap requestsResults"></div>
        </div>

        <div class="verticalSection requestsMine">
            <div class="sectionTitleContainer flex align-items-center">
                <h2 class="sectionTitle">My Requests</h2>
            </div>
            <div id="requestsMyStatus" class="fieldDescription requestsMessage" role="status" aria-live="polite"></div>
            <div id="requestsMyList" class="requestsMine-list"></div>
        </div>
    </div>

    <!-- Request dialog (moved to <body> at runtime so it layers above the header). -->
    <div id="requestsDialog" class="requestsDialogContainer" hidden>
        <div class="requestsDialogBackdrop" data-dialog-close></div>
        <div class="focuscontainer dialog formDialog requestsDialog" role="dialog" aria-modal="true" aria-labelledby="requestsDialogTitle">
            <div class="formDialogHeader">
                <button type="button" class="paper-icon-button-light btnCancel autoSize" data-dialog-close title="Close" aria-label="Close">
                    <span class="material-icons close" aria-hidden="true"></span>
                </button>
                <h3 id="requestsDialogTitle" class="formDialogHeaderTitle">Request</h3>
            </div>

            <div class="formDialogContent smoothScrollY">
                <div class="dialogContentInner dialog-content-centered requestsDialog-body">
                    <div class="requestsDialog-summary">
                        <div id="requestsDialogPoster" class="requestsDialog-poster cardImageContainer coveredImage defaultCardBackground"></div>
                        <div class="requestsDialog-info">
                            <div id="requestsDialogMeta" class="secondaryText requestsDialog-meta"></div>
                            <p id="requestsDialogOverview" class="requestsDialog-overview"></p>
                        </div>
                    </div>

                    <fieldset id="requestsTvScope" class="requestsFieldset" hidden>
                        <legend class="requestsFieldset-legend">What would you like?</legend>
                        <label class="requestsChoice"><input type="radio" name="requestsTvScope" value="EntireSeries" checked><span>Entire series</span></label>
                        <label class="requestsChoice"><input type="radio" name="requestsTvScope" value="SeasonSelection"><span>Specific seasons</span></label>
                        <div id="requestsSeasonList" class="requestsSeasons" hidden></div>
                        <label class="requestsChoice"><input type="radio" name="requestsTvScope" value="EpisodeSelection"><span>Specific episodes</span></label>
                        <div id="requestsEpisodeList" class="inputContainer requestsEpisodes" hidden>
                            <label class="inputLabel" for="requestsEpisodeIds">Episodes</label>
                            <input id="requestsEpisodeIds" class="emby-input" type="text" placeholder="S01E01, S01E02">
                            <div class="fieldDescription">Comma-separated, e.g. S01E01, S02E05.</div>
                        </div>
                    </fieldset>

                    <div class="selectContainer">
                        <label class="selectLabel" for="requestsQuality">Quality</label>
                        <select id="requestsQuality" class="emby-select-withcolor emby-select"></select>
                        <div class="selectArrowContainer"><span class="selectArrow material-icons keyboard_arrow_down" aria-hidden="true"></span></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel" for="requestsNote">Note (optional)</label>
                        <textarea id="requestsNote" class="emby-textarea" rows="3" maxlength="1000"></textarea>
                    </div>
                </div>
            </div>

            <div class="formDialogFooter">
                <!-- In the footer so errors are always visible, however far the form scrolls. -->
                <div id="requestsDialogMessage" class="fieldDescription requestsMessage requestsDialog-message" role="status" aria-live="polite"></div>
                <button id="requestsDialogSubmit" type="button" class="raised button-submit block btnSubmit formDialogFooterItem emby-button">
                    <span>Submit Request</span>
                </button>
            </div>
        </div>
    </div>
</div>
