<div id="requestsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input,emby-select">
    <div data-role="content">
        <div class="content-primary">
            <h2 class="sectionTitle">Jellyfin Requests</h2>
            <div class="buttonGroup">
                <button type="button" class="raised emby-button requests-config-tab" data-tab="general">General</button>
                <button type="button" class="raised emby-button requests-config-tab" data-tab="requests">Requests</button>
            </div>
            <section class="verticalSection requests-config-panel" data-panel="general">
                <h3>General</h3>
                <dl>
                    <dt>Plugin Version</dt>
                    <dd id="requestsGeneralVersion">Loading...</dd>
                    <dt>Search Provider Status</dt>
                    <dd id="requestsGeneralProviderStatus">Loading...</dd>
                </dl>
                <h3 class="requests-config-section-title">Media Options</h3>
                <div class="requests-media-options">
                    <label class="requests-media-option">
                        <input id="requestsEnableMovies" type="checkbox">
                        <span>Movies</span>
                    </label>
                    <label class="requests-media-option">
                        <input id="requestsEnableTvShows" type="checkbox">
                        <span>TV Shows</span>
                    </label>
                </div>
                <h3 class="requests-config-section-title">Media Quality Options</h3>
                <div id="requestsQualityOptions" class="verticalSection"></div>
                <button type="button" class="requests-quality-add" id="requestsQualityAdd">Add</button>
            </section>

            <section class="verticalSection requests-config-panel" data-panel="requests" hidden>
                <h3>Requests</h3>
                <div class="requests-admin-toolbar">
                    <input id="requestsAdminSearch" type="search" is="emby-input" placeholder="Search title, requester, notes, or provider">
                    <select id="requestsAdminStatus" is="emby-select" aria-label="Status filter">
                        <option value="">All statuses</option>
                        <option>Pending</option><option>Approved</option><option>Denied</option>
                        <option>InProgress</option><option>Available</option><option>Completed</option><option>Cancelled</option>
                    </select>
                    <select id="requestsAdminMediaType" is="emby-select" aria-label="Media type filter">
                        <option value="">All media types</option><option>Movie</option><option>TV Show</option>
                    </select>
                    <hr class="requests-admin-sort-divider">
                    <label class="fieldDescription" for="requestsAdminSort">Sort by</label>
                    <select id="requestsAdminSort" is="emby-select" aria-label="Sort by">
                        <option value="date">Request Date</option><option value="title">Title</option>
                        <option value="requester">Requester</option><option value="status">Status</option>
                    </select>
                    <button id="requestsAdminSortDirection" type="button" class="raised emby-button">Descending</button>
                </div>
                <table class="tblSettings">
                    <thead><tr>
                        <th>Poster</th><th>Title</th><th>Requested By</th>
                        <th>Request Date</th><th>Media Quality</th><th>Notes</th><th>Status</th><th>Actions</th>
                    </tr></thead>
                    <tbody id="requestsAdminRows"></tbody>
                </table>
            </section>

        </div>
    </div>

    <div id="requestsAdminDetails" class="requests-modal" hidden role="dialog" aria-modal="true">
        <div class="requests-modal-backdrop"></div>
        <div class="requests-modal-panel">
            <h3 id="requestsDetailsTitle">Request Details</h3>
            <img id="requestsDetailsPoster" class="requests-card-poster" alt="" hidden>
            <dl id="requestsDetailsList"></dl>
            <button id="requestsDetailsClose" type="button" class="raised emby-button">Close</button>
        </div>
    </div>

    <style>
        .requests-config-section-title { font-size: 1.35em; margin: 1.5em 0 .75em; }
        .requests-media-options { background: rgba(255,255,255,.08); border-radius: .25em; display: flex; flex-direction: column; gap: 0; margin-bottom: 1em; padding: 1.25em 1.5em; }
        .requests-media-option { align-items: center; display: flex; gap: .85em; min-height: 3.25em; }
        .requests-media-option input { accent-color: #00a4dc; height: 1.75em; margin: 0; width: 1.75em; }
        .requests-media-option span { font-size: 1.15em; }
        .requests-quality-row { align-items: center; display: flex; gap: .75em; margin: .5em 0; max-width: 42em; }
        .requests-quality-row input { flex: 1; }
        .requests-quality-delete { min-width: 2.5em; }
        .requests-quality-add { background: transparent; border: 1px solid currentColor; border-radius: .25em; color: inherit; margin-top: .75em; padding: .6em 1.5em; }
        .requests-status-approved { color: #66bb6a; }
        .requests-status-denied { color: #ef5350; }
        .requests-status-in-progress { color: #ffa726; }
        .requests-status-completed { color: #42a5f5; }
        .requests-status-pending { color: #bdbdbd; }
    </style>

</div>
