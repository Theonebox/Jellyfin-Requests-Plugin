<div id="requestsConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input,emby-select">
    <div data-role="content">
        <div class="content-primary">
            <h2 class="sectionTitle">Jellyfin Requests</h2>

            <div class="verticalSection">
                <div class="buttonGroup">
                    <button type="button" class="raised emby-button requests-config-tab" data-tab="general">General</button>
                    <button type="button" class="raised emby-button requests-config-tab" data-tab="requests">Requests</button>
                </div>
            </div>

            <div class="verticalSection requests-config-panel" data-panel="general">
                <h3>General</h3>
                <div class="fieldDescription">Configure the media quality choices shown to requesters.</div>
                <div class="inputContainer">
                    <label class="inputLabel" for="requestsQualityNewOption">Add Quality Option</label>
                    <input id="requestsQualityNewOption" type="text" is="emby-input">
                </div>
                <button type="button" class="raised button-submit emby-button" id="requestsQualityAdd">Add Option</button>
                <div class="verticalSection">
                    <div id="requestsQualityOptions"></div>
                </div>
            </div>

            <div class="verticalSection requests-config-panel" data-panel="requests" hidden>
                <h3>Requests</h3>
                <div class="inputContainer">
                    <label class="inputLabel" for="requestsAdminSearch">Search</label>
                    <input id="requestsAdminSearch" type="search" is="emby-input">
                </div>
                <div class="selectContainer">
                    <label class="selectLabel" for="requestsAdminStatus">Status</label>
                    <select id="requestsAdminStatus" is="emby-select">
                        <option value="">All statuses</option>
                        <option>Pending</option>
                        <option>Approved</option>
                        <option>Denied</option>
                        <option>InProgress</option>
                        <option>Available</option>
                        <option>Completed</option>
                        <option>Cancelled</option>
                    </select>
                </div>
                <table class="tblSettings">
                    <thead>
                        <tr>
                            <th>Poster</th>
                            <th>Title</th>
                            <th>Media Type</th>
                            <th>Request Scope</th>
                            <th>Status</th>
                            <th>Requester</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requestsAdminRows"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        (function () {
            const page = document.querySelector("#requestsConfigPage");
            let qualityOptions = [];
            let adminRequests = [];

            function escapeHtml(value) {
                return String(value == null ? "" : value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            function valueFor(request, key, upperKey) {
                return request[key] !== undefined ? request[key] : request[upperKey];
            }

            function scopeFor(request) {
                const scope = valueFor(request, "requestScope", "RequestScope");
                if (scope === "SeasonSelection") {
                    const seasons = valueFor(request, "requestedSeasonNumbers", "RequestedSeasonNumbers") || [];
                    return seasons.length ? "Seasons " + seasons.join(", ") : "Season Selection";
                }
                if (scope === "EpisodeSelection") return "Episode Selection";
                return scope === "EntireMovie" ? "Entire Movie" : "Entire Series";
            }

            function setTab(tabName) {
                page.querySelectorAll("[data-panel]").forEach(function (panel) {
                    panel.hidden = panel.dataset.panel !== tabName;
                });
                if (tabName === "requests") loadAdminRequests();
            }

            page.querySelectorAll(".requests-config-tab").forEach(function (button) {
                button.addEventListener("click", function () { setTab(button.dataset.tab); });
            });

            async function loadQualityOptions() {
                const response = await fetch("/Requests/Configuration/QualityOptions", { credentials: "same-origin" });
                if (!response.ok) throw new Error("Unable to load quality options.");
                const data = await response.json();
                qualityOptions = data.options || [];
                renderQualityOptions();
            }

            function renderQualityOptions() {
                const container = page.querySelector("#requestsQualityOptions");
                container.replaceChildren();
                qualityOptions.forEach(function (option, index) {
                    const row = document.createElement("div");
                    row.className = "listItem";
                    row.innerHTML =
                        `<span>${escapeHtml(option)}</span> ` +
                        `<button type="button" class="raised emby-button" data-index="${index}">Delete</button>`;
                    row.querySelector("button").addEventListener("click", async function () {
                        qualityOptions.splice(index, 1);
                        await saveQualityOptions();
                        await loadQualityOptions();
                    });
                    container.append(row);
                });
            }

            async function saveQualityOptions() {
                const response = await fetch("/Requests/Configuration/QualityOptions", {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ options: qualityOptions })
                });
                if (!response.ok) throw new Error("Unable to save quality options.");
            }

            page.querySelector("#requestsQualityAdd").addEventListener("click", async function () {
                const input = page.querySelector("#requestsQualityNewOption");
                const option = input.value.trim();
                if (!option) return;
                if (!qualityOptions.some(function (value) { return value.toLowerCase() === option.toLowerCase(); })) {
                    qualityOptions.push(option);
                    await saveQualityOptions();
                    await loadQualityOptions();
                }
                input.value = "";
            });

            async function loadAdminRequests() {
                const response = await fetch("/Requests", { credentials: "same-origin" });
                if (!response.ok) {
                    adminRequests = [];
                    renderAdminRequests("Administrator access is required.");
                    return;
                }
                adminRequests = await response.json();
                renderAdminRequests();
            }

            async function setRequestStatus(id, status) {
                const response = await fetch(`/Requests/${id}/status`, {
                    method: "PUT",
                    credentials: "same-origin",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: status })
                });
                if (!response.ok) throw new Error("Unable to update request status.");
                await loadAdminRequests();
            }

            function renderAdminRequests(errorMessage) {
                const rows = page.querySelector("#requestsAdminRows");
                rows.replaceChildren();
                if (errorMessage) {
                    const row = document.createElement("tr");
                    row.innerHTML = `<td colspan="7">${escapeHtml(errorMessage)}</td>`;
                    rows.append(row);
                    return;
                }

                const query = page.querySelector("#requestsAdminSearch").value.trim().toLowerCase();
                const statusFilter = page.querySelector("#requestsAdminStatus").value;
                adminRequests.filter(function (request) {
                    const title = String(valueFor(request, "title", "Title") || "").toLowerCase();
                    const requester = String(valueFor(request, "userName", "UserName") || "").toLowerCase();
                    const status = String(valueFor(request, "status", "Status") || "");
                    return (!query || title.includes(query) || requester.includes(query))
                        && (!statusFilter || status === statusFilter);
                }).forEach(function (request) {
                    const row = document.createElement("tr");
                    const id = valueFor(request, "id", "Id");
                    const posterUrl = valueFor(request, "posterUrl", "PosterUrl");
                    const status = valueFor(request, "status", "Status");
                    row.innerHTML =
                        `<td>${posterUrl ? `<img src="${escapeHtml(posterUrl)}" width="56" alt="">` : ""}</td>` +
                        `<td>${escapeHtml(valueFor(request, "title", "Title") || "")}</td>` +
                        `<td>${escapeHtml(valueFor(request, "mediaType", "MediaType") || "")}</td>` +
                        `<td>${escapeHtml(scopeFor(request))}</td>` +
                        `<td>${escapeHtml(status || "Pending")}</td>` +
                        `<td>${escapeHtml(valueFor(request, "userName", "UserName") || "Unknown")}</td>` +
                        `<td>
                            <button type="button" class="raised emby-button" data-action="approve">Approve</button>
                            <button type="button" class="raised emby-button" data-action="deny">Deny</button>
                            <button type="button" class="raised emby-button" data-action="available">Mark Available</button>
                        </td>`;
                    ["approve", "deny", "available"].forEach(function (action) {
                        row.querySelector(`[data-action="${action}"]`).addEventListener("click", async function () {
                            const newStatus = action === "approve" ? "Approved" : action === "deny" ? "Denied" : "Available";
                            try { await setRequestStatus(id, newStatus); } catch (error) { window.alert(error.message); }
                        });
                    });
                    rows.append(row);
                });
            }

            page.querySelector("#requestsAdminSearch").addEventListener("input", function () { renderAdminRequests(); });
            page.querySelector("#requestsAdminStatus").addEventListener("change", function () { renderAdminRequests(); });

            loadQualityOptions().catch(function (error) {
                window.alert(error.message || "Unable to load quality options.");
            });
            setTab("general");
        })();
    </script>
</div>
